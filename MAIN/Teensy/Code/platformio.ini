[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
test_build_project_src = false
lib_deps = 
	adafruit/Adafruit PWM Servo Driver Library
	adafruit/Adafruit BME280 Library
	adafruit/Adafruit Unified Sensor
	ftrias/TeensyThreads
	https://github.com/tonton81/FlexCAN_T4.git
	askuric/Simple FOC@^2.3.5
	; throwtheswitch/Unity@^2.6.1 ; for testing only
